# HTTPS virtual host, using a self-signed certificate generated when building the image.

Listen 443

<VirtualHost *:443>
    SetEnv GLPI_ENVIRONMENT_TYPE development

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/glpi.crt
    SSLCertificateKeyFile /etc/apache2/ssl/glpi.key

    # Restricted to this virtual host, HTTP ones keep sending the session cookie.
    php_flag session.cookie_secure on

    Include vhosts/glpi-common.conf
</VirtualHost>
