name: "Pull locales translations"

permissions:
  contents: "read"

on:
  # Runs once a week, after the source push, to bring back up-to-date translations
  schedule:
    - cron: "0 4 * * 1"
  # Enable manual run
  workflow_dispatch:

jobs:
  pull-from-transifex:
    if: github.repository == 'glpi-project/glpi'
    permissions:
      contents: "write" # needed to open a pull request with the synced translations
      pull-requests: "write"
    name: "Pull locales translations (${{ matrix.branch }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {branch: "11.0/bugfixes", php-version: "8.2"}
          - {branch: "12.0/bugfixes", php-version: "8.3"}
          - {branch: "main", php-version: "8.3"}
    env:
      COMPOSE_FILE: ".github/actions/docker-compose-app.yml"
      APPLICATION_ROOT: "${{ github.workspace }}"
      PHP_IMAGE: "githubactions-php-apache:${{ matrix.php-version }}"
      UPDATE_FILES_ACL: true
    steps:
      - name: "Set env"
        run: |
          echo "APP_CONTAINER_HOME=${{ runner.temp }}/app_home" >> $GITHUB_ENV
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          ref: "${{ matrix.branch }}"
      - name: "Restore dependencies cache"
        uses: "actions/cache@v6"
        with:
          path: |
            ${{ env.APP_CONTAINER_HOME }}/.cache/composer/
            ${{ env.APP_CONTAINER_HOME }}/.npm/_cacache/
          key: "app_home_deps-${{ matrix.php-version }}-${{ hashFiles('composer.lock', 'package-lock.json') }}"
          restore-keys: |
            app_home_deps-${{ matrix.php-version }}-
            app_home_deps-
      - name: "Pull translations"
        uses: "transifex/cli-action@v2"
        with:
          args: "pull --force --all --minimum-perc=80"
          token: "${{ secrets.TRANSIFEX_TOKEN }}"
      - name: "Initialize containers"
        run: |
          .github/actions/init_containers-start.sh
      - name: "Build dependencies / translations"
        run: |
          docker compose exec -T app .github/actions/init_build.sh
      - name: "Compile MO files"
        run: |
          docker compose exec -T app bin/console tools:locales:compile
      - name: "Check status"
        id: "check-status"
        run: |
          # en_GB.mo is always regenerated by the compile command, ignore it to avoid "empty" PRs
          if [[ `git status --porcelain locales/*.mo ':(exclude)locales/en_GB.mo'` ]]; then
            echo "create_pr=yes" >> $GITHUB_OUTPUT
          else
            echo "create_pr=no" >> $GITHUB_OUTPUT
          fi
      - name: "Create Pull Request"
        if: steps.check-status.outputs.create_pr == 'yes'
        uses: "peter-evans/create-pull-request@v8"
        with:
          token: "${{ secrets.LOCALES_SYNC_TOKEN }}"
          commit-message: "i18n-updates"
          branch: "locales-sync/${{ matrix.branch }}"
          delete-branch: true
          title: "Update translations (${{ matrix.branch }})"
          base: "${{ matrix.branch }}"
          add-paths: |
            locales/*.po
            locales/*.mo
